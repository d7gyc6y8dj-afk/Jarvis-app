<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&display=swap');
        body { background-color: #050505; color: #fff; font-family: 'Roboto Mono', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; user-select: none; -webkit-user-select: none; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; background-image: radial-gradient(circle at center, #111 0%, #000 100%); }
        
        .jarvis-icon-container { position: relative; width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; margin-bottom: 40px; transition: all 0.3s ease; }
        .black-hole { position: absolute; background-color: #000; border-radius: 50%; box-shadow: 0 0 20px 2px rgba(80, 60, 50, 0.4); transition: box-shadow 0.3s ease; }
        .hole-1 { width: 70px; height: 70px; left: 20px; top: 50px; z-index: 2; }
        .hole-2 { width: 90px; height: 90px; right: 20px; top: 70px; z-index: 1; }
        
        .jarvis-icon-container.active .black-hole { 
            box-shadow: 0 0 40px 10px rgba(180, 150, 120, 0.9), inset 0 0 20px rgba(180, 150, 120, 0.5); 
            animation: pulse 1.5s infinite alternate; 
        }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        
        .container { border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px; background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(10px); text-align: center; max-width: 500px; width: 100%; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        h1 { font-weight: 300; letter-spacing: 8px; margin: 0 0 10px 0; font-size: 24px; }
        #status { font-size: 14px; color: #888; min-height: 40px; margin-bottom: 30px; line-height: 1.5; }
        .controls { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        
        button { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); padding: 15px 30px; font-family: 'Roboto Mono', monospace; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 8px; transition: all 0.2s ease; width: 100%; max-width: 300px; }
        
        #talkBtn { border: 2px solid rgba(180, 150, 120, 0.5); color: #d4c5b9; padding: 25px; font-size: 16px; border-radius: 50px; }
        #talkBtn.listening { 
            background: rgba(180, 150, 120, 0.15); 
            border-color: rgba(180, 150, 120, 0.9); 
            box-shadow: 0 0 25px rgba(180, 150, 120, 0.5); 
            color: #fff; 
        }
        
        #openBtn { display: none; box-sizing: border-box; text-decoration: none; text-align: center; color: #fff; background: rgba(180, 150, 120, 0.25); border: 2px solid rgba(180, 150, 120, 0.9); padding: 15px 30px; font-size: 14px; letter-spacing: 2px; border-radius: 8px; width: 100%; max-width: 300px; }
        #windowModeBtn { font-size: 11px; padding: 10px; border-color: rgba(255, 255, 255, 0.1); color: #666; }
        #windowModeBtn.active { color: #fff; border-color: #fff; }
        html { background: #000; }

        /* Компактный режим во время игры, чтобы поле помещалось на экран телефона */
        body.game-mode { justify-content: flex-start; padding-top: 10px; padding-bottom: 140px; }
        body.game-mode .jarvis-icon-container { width: 120px; height: 90px; margin-bottom: 10px; transform: scale(0.55); }
        body.game-mode .container { padding: 20px; }
        body.game-mode #status { margin-bottom: 15px; min-height: 20px; }

        /* Анимация кубика и монетки */
        #rollArea { position: fixed; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom)); transform: translate(-50%, 150%); opacity: 0; transition: transform 0.4s ease, opacity 0.4s ease; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
        #rollArea.show { transform: translate(-50%, 0); opacity: 1; }
        #rollResult { font-size: 14px; letter-spacing: 3px; color: #d4c5b9; min-height: 18px; text-transform: uppercase; }
        .dice { width: 80px; height: 80px; background: #f2ebe4; border-radius: 16px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 10px; box-sizing: border-box; box-shadow: 0 0 25px rgba(180, 150, 120, 0.6); }
        .dice .pip { width: 14px; height: 14px; border-radius: 50%; background: #111; align-self: center; justify-self: center; visibility: hidden; }
        .dice .pip.on { visibility: visible; }
        .dice.rolling { animation: diceRoll 0.35s linear infinite; }
        @keyframes diceRoll { 0% { transform: rotate(0deg) translateY(0); } 25% { transform: rotate(90deg) translateY(-25px); } 50% { transform: rotate(180deg) translateY(0); } 75% { transform: rotate(270deg) translateY(-15px); } 100% { transform: rotate(360deg) translateY(0); } }
        .dice.landed { animation: land 0.3s ease-out; }
        @keyframes land { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
        .coin { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f5d98b, #b8862b 70%, #7a5615); border: 3px solid #e6c36a; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #4a3208; box-shadow: 0 0 25px rgba(230, 195, 106, 0.6); }
        .coin.flipping { animation: coinFlip 0.25s linear infinite; }
        @keyframes coinFlip { 0% { transform: rotateX(0deg) translateY(0); } 50% { transform: rotateX(180deg) translateY(-30px); } 100% { transform: rotateX(360deg) translateY(0); } }
        .coin.landed { animation: land 0.3s ease-out; }

        #game-board { display: none; grid-template-columns: repeat(3, 60px); gap: 5px; justify-content: center; margin-top: 20px; }
        .cell { width: 60px; height: 60px; background: #111; border: 1px solid rgba(255,255,255,0.1); font-size: 24px; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
    </style>
</head>
<body>

    <div class="jarvis-icon-container" id="jarvisIcon">
        <div class="black-hole hole-1"></div>
        <div class="black-hole hole-2"></div>
    </div>

    <div class="container">
        <h1>J.A.R.V.I.S.</h1>
        <div id="status">Нажми кнопку и говори</div>
        <div class="controls">
            <button id="talkBtn">НАЖМИ И ГОВОРИ</button>
            <a id="openBtn" href="#" target="_blank" rel="noopener">ОТКРЫТЬ</a>
            <button id="windowModeBtn" class="active">Режим окон: ВКЛ</button>
        </div>
        <div id="game-board">
            <div class="cell" data-index="0"></div><div class="cell" data-index="1"></div><div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div><div class="cell" data-index="4"></div><div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div><div class="cell" data-index="7"></div><div class="cell" data-index="8"></div>
        </div>
    </div>

    <div id="rollArea">
        <div id="rollObject"></div>
        <div id="rollResult"></div>
    </div>

    <script>
        const talkBtn = document.getElementById('talkBtn');
        const windowModeBtn = document.getElementById('windowModeBtn');
        const statusText = document.getElementById('status');
        const jarvisIcon = document.getElementById('jarvisIcon');
        const gameBoard = document.getElementById('game-board');
        const cells = document.querySelectorAll('.cell');
        const openBtn = document.getElementById('openBtn');

        let isWindowMode = true;
        let isListening = false;
        let isGameActive = false;
        let board = ["", "", "", "", "", "", "", "", ""];

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;

        windowModeBtn.addEventListener('click', () => {
            isWindowMode = !isWindowMode;
            windowModeBtn.textContent = isWindowMode ? "Режим окон: ВКЛ" : "Режим окон: ВЫКЛ";
            windowModeBtn.classList.toggle('active');
        });

        function openLink(url) {
            let win = null;
            try {
                if (isWindowMode) {
                    win = window.open(url, '_blank', 'width=500,height=700,menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes');
                } else {
                    win = window.open(url, '_blank');
                }
            } catch (e) { win = null; }

            // Если браузер заблокировал окно, показываем кнопку: нажатие на неё браузер разрешает
            if (!win) {
                openBtn.href = url;
                openBtn.style.display = 'block';
                setTimeout(() => { statusText.textContent = "Браузер заблокировал окно. Нажми «ОТКРЫТЬ»."; }, 50);
            } else {
                openBtn.style.display = 'none';
            }
        }

        openBtn.addEventListener('click', () => {
            setTimeout(() => { openBtn.style.display = 'none'; }, 100);
        });

        function speak(text) {
            synth.cancel();
            if (synth.paused) synth.resume();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            
            const voices = synth.getVoices();
            const ruVoices = voices.filter(v => v.lang.includes('ru'));
            const maleVoice = ruVoices.find(v => v.name.includes('Yuri') || v.name.includes('Юрий') || v.name.includes('Pavel') || v.name.includes('Павел'));
            
            if (maleVoice) utterance.voice = maleVoice;
            else if (ruVoices.length > 0) utterance.voice = ruVoices[0];

            utterance.pitch = 0.8; 
            utterance.rate = 1.15;  

            utterance.onstart = () => {
                jarvisIcon.classList.add('active');
                statusText.textContent = "Говорю...";
            };
            utterance.onend = () => {
                jarvisIcon.classList.remove('active');
                if(!isListening) statusText.textContent = openBtn.style.display === 'block' ? "Браузер заблокировал окно. Нажми «ОТКРЫТЬ»." : "Ожидание...";
            };
            synth.speak(utterance);
        }

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.continuous = false;

            talkBtn.addEventListener('click', () => {
                if (isListening) return;

                try {
                    recognition.start();
                    isListening = true;
                    talkBtn.textContent = "СЛУШАЮ...";
                    talkBtn.classList.add('listening');
                    statusText.textContent = "Говори...";
                    jarvisIcon.classList.add('active');
                    
                    const unlock = new SpeechSynthesisUtterance('');
                    unlock.volume = 0;
                    synth.speak(unlock);
                } catch(e) {
                    statusText.textContent = "Ошибка. Подожди секунду.";
                }
            });

            recognition.onresult = (event) => {
                let command = event.results[0][0].transcript.toLowerCase().replace(/ё/g, 'е').replace(/[.,!?]/g, '').trim();
                if (command.includes('крестики нолики')) command = command.replace('крестики нолики', 'крестики-нолики');
                statusText.textContent = `Вы: "${command}"`;
                
                isListening = false;
                talkBtn.textContent = "НАЖМИ И ГОВОРИ";
                talkBtn.classList.remove('listening');
                jarvisIcon.classList.remove('active');

                // --- КОМАНДЫ БЕЗ ЗАДЕРЖКИ ---

                if (command.includes('погода') || command.includes('погоду')) {
                    speak("Открываю прогноз погоды в Анадыре.");
                    openLink('https://yandex.ru/pogoda/anadyr');
                }
                else if (command.includes('привет') || command.includes('здравствуй')) {
                    speak("Здравствуйте, сэр. Системы в норме.");
                }
                else if (command.includes('включи видео') || command.includes('найди видео')) {
                    let videoName = command.replace('джарвис', '').replace('включи видео', '').replace('найди видео', '').replace('на ютубе', '').replace('в ютубе', '').trim();
                    if (videoName) { speak(`Ищу видео ${videoName}.`); openLink(`https://www.youtube.com/results?search_query=${encodeURIComponent(videoName)}`); } else { speak("Какое видео найти?"); }
                }
                else if (command.includes('открой канал')) {
                    let channelName = command.replace('джарвис', '').replace('открой канал', '').replace('на ютубе', '').trim();
                    if (channelName) { speak(`Открываю канал ${channelName}.`); openLink(`https://www.youtube.com/results?search_query=${encodeURIComponent(channelName)}&sp=EgIQAg%253D%253D`); } else { speak("Какой канал?"); }
                }
                else if (command.includes('видео в вк')) {
                    let vkVideo = command.replace('джарвис', '').replace('видео в вк', '').trim();
                    if (vkVideo) { speak(`Ищу ${vkVideo} во ВКонтакте.`); openLink(`https://vk.com/video?q=${encodeURIComponent(vkVideo)}`); } else { speak("Какое видео?"); }
                }
                else if (command.includes('рутуб')) {
                    let rutubeSearch = command.replace('джарвис', '').replace('открой рутуб', '').replace('найди на рутубе', '').replace('рутуб', '').trim();
                    if (rutubeSearch) { speak(`Ищу ${rutubeSearch} на Рутубе.`); openLink(`https://rutube.ru/search/?query=${encodeURIComponent(rutubeSearch)}`); } else { speak("Открываю Рутуб."); openLink('https://rutube.ru'); }
                }
                else if (command.includes('открой ютуб')) { speak("Открываю."); openLink('https://youtube.com'); }
                else if (command.includes('открой вк')) { speak("Открываю."); openLink('https://vk.com'); }
                else if (command.includes('расскажи о') || command.includes('расскажи про') || command.includes('что такое')) {
                    let topic = command.replace('джарвис', '').replace('расскажи о', '').replace('расскажи про', '').replace('что такое', '').trim();
                    if (topic) { speak(`Открываю информацию.`); openLink(`https://yandex.ru/search/?text=${encodeURIComponent(topic)}`); } else { speak("О чем рассказать?"); }
                }
                else if (command.includes('включи музыку')) {
                    let song = command.replace('джарвис', '').replace('включи музыку', '').trim();
                    if (song) { speak(`Ищу ${song}.`); openLink(`https://music.yandex.ru/search?text=${encodeURIComponent(song)}`); } else { speak("Какую песню?"); }
                }
                else if (command.includes('время')) { speak(`Сейчас ${new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}`); }
                else if (command.includes('кубик')) { rollDice(); }
                else if (command.includes('монет')) { flipCoin(); }
                else if (command.includes('поиграем') || command.includes('крестики-нолики')) { 
                    board = ["", "", "", "", "", "", "", "", ""]; isGameActive = true;
                    cells.forEach((cell, i) => { cell.textContent = ""; });
                    gameBoard.style.display = "grid";
                    document.body.classList.add('game-mode');
                    setTimeout(() => { gameBoard.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 350);
                    speak("Ваш ход. Назовите клетку.");
                }
                else if (isGameActive) {
                    let index = -1;
                    if (command.includes('верхняя левая')) index = 0; else if (command.includes('верхняя средняя')) index = 1; else if (command.includes('верхняя правая')) index = 2;
                    else if (command.includes('средняя левая')) index = 3; else if (command.includes('центр')) index = 4; else if (command.includes('средняя правая')) index = 5;
                    else if (command.includes('нижняя левая')) index = 6; else if (command.includes('нижняя средняя')) index = 7; else if (command.includes('нижняя правая')) index = 8;

                    if (index !== -1 && board[index] === "") {
                        board[index] = "X"; cells[index].textContent = "X";
                        if (!checkWin("X")) { makeAiMove(); }
                        checkGameEnd();
                    }
                }
                else { speak("Команда не распознана."); }
            };
            
            recognition.onend = () => {
                isListening = false;
                talkBtn.classList.remove('listening'); 
                talkBtn.textContent = "НАЖМИ И ГОВОРИ"; 
                jarvisIcon.classList.remove('active');
            };

            recognition.onerror = (event) => { 
                isListening = false;
                talkBtn.classList.remove('listening'); 
                talkBtn.textContent = "НАЖМИ И ГОВОРИ"; 
                jarvisIcon.classList.remove('active');
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    statusText.textContent = "Разреши доступ к микрофону!";
                } else if (event.error === 'audio-capture') {
                    statusText.textContent = "Микрофон не найден.";
                } else if (event.error === 'network') {
                    statusText.textContent = "Нет связи с сервисом распознавания речи. Проверь интернет.";
                } else if (event.error === 'aborted') {
                    statusText.textContent = "Нажми кнопку и говори";
                } else if (event.error === 'no-speech') {
                    statusText.textContent = "Я ничего не услышал. Попробуй еще раз.";
                } else {
                    statusText.textContent = "Ошибка. Нажми еще раз.";
                }
            }
        } else {
            statusText.textContent = "Этот браузер не поддерживает голосовые команды. Открой сайт в Chrome, Edge или Safari.";
            talkBtn.addEventListener('click', () => {
                statusText.textContent = "Этот браузер не поддерживает голосовые команды. Открой сайт в Chrome, Edge или Safari.";
            });
        }

        if (synth && synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = () => synth.getVoices();
        }

        // --- КУБИК И МОНЕТКА С АНИМАЦИЕЙ ---
        const rollArea = document.getElementById('rollArea');
        const rollObject = document.getElementById('rollObject');
        const rollResult = document.getElementById('rollResult');
        const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
        let rollTimer = null, hideTimer = null;

        function drawDice(n) {
            rollObject.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const pip = document.createElement('div');
                pip.className = 'pip' + (PIPS[n].includes(i) ? ' on' : '');
                rollObject.appendChild(pip);
            }
        }

        function startRoll() {
            clearInterval(rollTimer); clearTimeout(hideTimer);
            rollResult.textContent = '';
            rollArea.classList.add('show');
        }

        function finishRoll(text) {
            rollResult.textContent = text;
            speak(text);
            hideTimer = setTimeout(() => { rollArea.classList.remove('show'); }, 4000);
        }

        function rollDice() {
            const result = Math.floor(Math.random() * 6) + 1;
            startRoll();
            rollObject.className = 'dice rolling';
            drawDice(1);
            rollTimer = setInterval(() => { drawDice(Math.floor(Math.random() * 6) + 1); }, 100);
            setTimeout(() => {
                clearInterval(rollTimer);
                drawDice(result);
                rollObject.className = 'dice landed';
                finishRoll(`Выпало ${result}`);
            }, 1500);
        }

        function flipCoin() {
            const result = Math.random() < 0.5 ? 'Орёл' : 'Решка';
            startRoll();
            rollObject.className = 'coin flipping';
            rollObject.innerHTML = '';
            let side = 0;
            rollTimer = setInterval(() => { side = 1 - side; rollObject.textContent = side ? 'ОРЁЛ' : 'РЕШКА'; }, 125);
            setTimeout(() => {
                clearInterval(rollTimer);
                rollObject.textContent = result.toUpperCase();
                rollObject.className = 'coin landed';
                finishRoll(result === 'Орёл' ? 'Выпал орёл' : 'Выпала решка');
            }, 1500);
        }

        function makeAiMove() {
            for (let i = 0; i < 9; i++) { if (board[i] === "") { board[i] = "O"; if (checkWin("O")) { cells[i].textContent = "O"; return; } board[i] = ""; } }
            for (let i = 0; i < 9; i++) { if (board[i] === "") { board[i] = "X"; if (checkWin("X")) { board[i] = "O"; cells[i].textContent = "O"; return; } board[i] = ""; } }
            if (board[4] === "") { board[4] = "O"; cells[4].textContent = "O"; return; }
            let empty = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            if (empty.length > 0) { let r = empty[Math.floor(Math.random() * empty.length)]; board[r] = "O"; cells[r].textContent = "O"; }
        }
        function checkWin(p) {
            const w = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];
            return w.some(v => v.every(i => board[i] === p));
        }
        function checkGameEnd() {
            if (checkWin("X")) { speak("Вы победили!"); isGameActive = false; }
            else if (checkWin("O")) { speak("Я победил."); isGameActive = false; }
            else if (board.every(c => c !== "")) { speak("Ничья."); isGameActive = false; }
        }
        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                if (!isGameActive) return;
                let index = parseInt(cell.dataset.index);
                if (board[index] === "") {
                    board[index] = "X"; cell.textContent = "X";
                    if (!checkWin("X")) { makeAiMove(); }
                    checkGameEnd();
                }
            });
        });
    </script>
</body>
</html>
