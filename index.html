<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&display=swap');
        body { background-color: #050505; color: #fff; font-family: 'Roboto Mono', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; user-select: none; -webkit-user-select: none; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; background-image: radial-gradient(circle at center, #111 0%, #000 100%); }
        
        .jarvis-icon-container { position: relative; width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; margin-bottom: 40px; transition: all 0.3s ease; }
        .black-hole { position: absolute; background-color: #000; border-radius: 50%; box-shadow: 0 0 20px 2px rgba(80, 60, 50, 0.4); transition: box-shadow 0.3s ease; }
        .hole-1 { width: 70px; height: 70px; left: 20px; top: 50px; z-index: 2; }
        .hole-2 { width: 90px; height: 90px; right: 20px; top: 70px; z-index: 1; }
        
        .jarvis-icon-container.active .black-hole { 
            box-shadow: 0 0 40px 10px rgba(180, 150, 120, 0.9), inset 0 0 20px rgba(180, 150, 120, 0.5); 
            animation: pulse 1.5s infinite alternate; 
        }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        
        .container { border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px; background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(10px); text-align: center; max-width: 500px; width: 100%; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        h1 { font-weight: 300; letter-spacing: 8px; margin: 0 0 10px 0; font-size: 24px; }
        #status { font-size: 14px; color: #888; min-height: 40px; margin-bottom: 30px; line-height: 1.5; }
        .controls { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        
        button { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); padding: 15px 30px; font-family: 'Roboto Mono', monospace; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 8px; transition: all 0.2s ease; width: 100%; max-width: 300px; }
        
        #talkBtn { border: 2px solid rgba(180, 150, 120, 0.5); color: #d4c5b9; padding: 25px; font-size: 16px; border-radius: 50px; }
        #talkBtn.listening { 
            background: rgba(180, 150, 120, 0.15); 
            border-color: rgba(180, 150, 120, 0.9); 
            box-shadow: 0 0 25px rgba(180, 150, 120, 0.5); 
            color: #fff; 
        }
        
        #openBtn { display: none; box-sizing: border-box; text-decoration: none; text-align: center; color: #fff; background: rgba(180, 150, 120, 0.25); border: 2px solid rgba(180, 150, 120, 0.9); padding: 15px 30px; font-size: 14px; letter-spacing: 2px; border-radius: 8px; width: 100%; max-width: 300px; }
        #windowModeBtn { font-size: 11px; padding: 10px; border-color: rgba(255, 255, 255, 0.1); color: #666; }
        #windowModeBtn.active { color: #fff; border-color: #fff; }
        html { background: #000; }

        /* Компактный режим во время игры, чтобы поле помещалось на экран телефона */
        body.game-mode { justify-content: flex-start; padding-top: 10px; padding-bottom: 140px; }
        body.game-mode .jarvis-icon-container { width: 120px; height: 90px; margin-bottom: 10px; transform: scale(0.55); }
        body.game-mode .container { padding: 20px; }
        body.game-mode #status { margin-bottom: 15px; min-height: 20px; }

        /* Анимация кубика и монетки */
        body.rolling { padding-bottom: calc(160px + env(safe-area-inset-bottom)); }
        #rollArea { display: none; flex-direction: column; align-items: center; gap: 12px; margin-top: 25px; padding: 20px 0 5px; }
        #rollArea.show { display: flex; -webkit-animation: rollIn 0.35s ease-out; animation: rollIn 0.35s ease-out; }
        @-webkit-keyframes rollIn { from { opacity: 0; -webkit-transform: translateY(30px); } to { opacity: 1; -webkit-transform: translateY(0); } }
        @keyframes rollIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        #rollResult { font-size: 14px; letter-spacing: 3px; color: #d4c5b9; min-height: 18px; text-transform: uppercase; }
        /* 3D-кубик */
        .scene { width: 120px; height: 140px; -webkit-perspective: 600px; perspective: 600px; display: flex; align-items: flex-end; justify-content: center; }
        .toss { width: 80px; height: 80px; -webkit-transform-style: preserve-3d; transform-style: preserve-3d; }
        .toss.jump { -webkit-animation: tossJump 1.6s cubic-bezier(.3,.6,.4,1) both; animation: tossJump 1.6s cubic-bezier(.3,.6,.4,1) both; }
        @-webkit-keyframes tossJump { 0% { -webkit-transform: translateY(0); } 30% { -webkit-transform: translateY(-55px); } 60% { -webkit-transform: translateY(0); } 72% { -webkit-transform: translateY(-14px); } 84% { -webkit-transform: translateY(0); } 92% { -webkit-transform: translateY(-4px); } 100% { -webkit-transform: translateY(0); } }
        @keyframes tossJump { 0% { transform: translateY(0); } 30% { transform: translateY(-55px); } 60% { transform: translateY(0); } 72% { transform: translateY(-14px); } 84% { transform: translateY(0); } 92% { transform: translateY(-4px); } 100% { transform: translateY(0); } }
        .cube { position: relative; width: 80px; height: 80px; -webkit-transform-style: preserve-3d; transform-style: preserve-3d; }
        .cube.spin { -webkit-transition: -webkit-transform 1.6s cubic-bezier(.2,.7,.25,1); transition: transform 1.6s cubic-bezier(.2,.7,.25,1); }
        .cube .face { position: absolute; width: 80px; height: 80px; box-sizing: border-box; padding: 10px; border-radius: 14px; background: radial-gradient(circle at 30% 30%, #ffffff, #e9e0d6); border: 1px solid #cbbfb2; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); -webkit-backface-visibility: hidden; backface-visibility: hidden; box-shadow: inset 0 0 12px rgba(0,0,0,0.15); }
        .cube .pip { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #444, #000); align-self: center; justify-self: center; visibility: hidden; }
        .cube .pip.on { visibility: visible; }
        .cube .f1 { -webkit-transform: translateZ(40px); transform: translateZ(40px); }
        .cube .f6 { -webkit-transform: rotateY(180deg) translateZ(40px); transform: rotateY(180deg) translateZ(40px); }
        .cube .f3 { -webkit-transform: rotateY(90deg) translateZ(40px); transform: rotateY(90deg) translateZ(40px); }
        .cube .f4 { -webkit-transform: rotateY(-90deg) translateZ(40px); transform: rotateY(-90deg) translateZ(40px); }
        .cube .f2 { -webkit-transform: rotateX(90deg) translateZ(40px); transform: rotateX(90deg) translateZ(40px); }
        .cube .f5 { -webkit-transform: rotateX(-90deg) translateZ(40px); transform: rotateX(-90deg) translateZ(40px); }
        .shadow3d { width: 70px; height: 12px; margin: 6px auto 0; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(180,150,120,0.45), transparent 70%); }

        /* 3D-монетка */
        .coin3d { position: relative; width: 90px; height: 90px; -webkit-transform-style: preserve-3d; transform-style: preserve-3d; }
        .coin3d.spin { -webkit-transition: -webkit-transform 1.6s cubic-bezier(.25,.6,.3,1); transition: transform 1.6s cubic-bezier(.25,.6,.3,1); }
        .coin3d .side, .coin3d .edge { position: absolute; left: 0; top: 0; width: 90px; height: 90px; border-radius: 50%; box-sizing: border-box; }
        .coin3d .side { background: radial-gradient(circle at 35% 30%, #fff1b8, #e3b64a 45%, #a8771f 85%); border: 4px solid #c99a35; box-shadow: inset 0 0 0 3px rgba(255,240,190,0.5), inset 0 0 14px rgba(90,60,10,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #5a3d08; font-size: 11px; font-weight: 700; letter-spacing: 1px; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
        .coin3d .side svg { width: 36px; height: 36px; margin-bottom: 2px; }
        .coin3d .heads { -webkit-transform: translateZ(4px); transform: translateZ(4px); }
        .coin3d .tails { -webkit-transform: rotateX(180deg) translateZ(4px); transform: rotateX(180deg) translateZ(4px); }
        .coin3d .edge { background: linear-gradient(90deg, #7a5615, #c99a35, #7a5615); border: 1px solid #6b4a10; }

        #weatherCard { display: none; margin-top: 20px; padding: 15px; border: 1px solid rgba(180, 150, 120, 0.4); border-radius: 12px; background: rgba(180, 150, 120, 0.08); text-align: left; font-size: 13px; line-height: 1.6; color: #d4c5b9; }
        #weatherCard .w-city { font-size: 15px; color: #fff; letter-spacing: 1px; }
        #weatherCard .w-temp { font-size: 30px; color: #fff; font-weight: 300; margin: 4px 0; }

        #game-board { display: none; grid-template-columns: repeat(3, 60px); gap: 5px; justify-content: center; margin-top: 20px; }
        .cell { width: 60px; height: 60px; background: #111; border: 1px solid rgba(255,255,255,0.1); font-size: 24px; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
    </style>
</head>
<body>

    <div class="jarvis-icon-container" id="jarvisIcon">
        <div class="black-hole hole-1"></div>
        <div class="black-hole hole-2"></div>
    </div>

    <div class="container">
        <h1>J.A.R.V.I.S.</h1>
        <div id="status">Нажми кнопку и говори</div>
        <div class="controls">
            <button id="talkBtn">НАЖМИ И ГОВОРИ</button>
            <a id="openBtn" href="#" target="_blank" rel="noopener">ОТКРЫТЬ</a>
            <button id="windowModeBtn" class="active">Режим окон: ВКЛ</button>
        </div>
        <div id="rollArea">
            <div id="rollObject"></div>
            <div id="rollResult"></div>
        </div>
        <div id="weatherCard"></div>
        <div id="game-board">
            <div class="cell" data-index="0"></div><div class="cell" data-index="1"></div><div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div><div class="cell" data-index="4"></div><div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div><div class="cell" data-index="7"></div><div class="cell" data-index="8"></div>
        </div>
    </div>


    <script>
        const talkBtn = document.getElementById('talkBtn');
        const windowModeBtn = document.getElementById('windowModeBtn');
        const statusText = document.getElementById('status');
        const jarvisIcon = document.getElementById('jarvisIcon');
        const gameBoard = document.getElementById('game-board');
        const cells = document.querySelectorAll('.cell');
        const openBtn = document.getElementById('openBtn');

        let isWindowMode = true;
        let afterSpeechStatus = '';
        let isListening = false;
        let isGameActive = false;
        let board = ["", "", "", "", "", "", "", "", ""];

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;

        windowModeBtn.addEventListener('click', () => {
            isWindowMode = !isWindowMode;
            windowModeBtn.textContent = isWindowMode ? "Режим окон: ВКЛ" : "Режим окон: ВЫКЛ";
            windowModeBtn.classList.toggle('active');
        });

        function openLink(url) {
            let win = null;
            try {
                if (isWindowMode) {
                    win = window.open(url, '_blank', 'width=500,height=700,menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes');
                } else {
                    win = window.open(url, '_blank');
                }
            } catch (e) { win = null; }

            // Если браузер заблокировал окно, показываем кнопку: нажатие на неё браузер разрешает
            if (!win) {
                openBtn.href = url;
                openBtn.style.display = 'block';
                setTimeout(() => { statusText.textContent = "Браузер заблокировал окно. Нажми «ОТКРЫТЬ»."; }, 50);
            } else {
                openBtn.style.display = 'none';
            }
        }

        openBtn.addEventListener('click', () => {
            setTimeout(() => { openBtn.style.display = 'none'; }, 100);
        });

        function speak(text) {
            synth.cancel();
            if (synth.paused) synth.resume();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            
            const voices = synth.getVoices();
            const ruVoices = voices.filter(v => v.lang.includes('ru'));
            const maleVoice = ruVoices.find(v => v.name.includes('Yuri') || v.name.includes('Юрий') || v.name.includes('Pavel') || v.name.includes('Павел'));
            
            if (maleVoice) utterance.voice = maleVoice;
            else if (ruVoices.length > 0) utterance.voice = ruVoices[0];

            utterance.pitch = 0.8; 
            utterance.rate = 1.15;  

            utterance.onstart = () => {
                jarvisIcon.classList.add('active');
                statusText.textContent = "Говорю...";
            };
            utterance.onend = () => {
                jarvisIcon.classList.remove('active');
                if(!isListening) statusText.textContent = afterSpeechStatus || (openBtn.style.display === 'block' ? "Браузер заблокировал окно. Нажми «ОТКРЫТЬ»." : "Ожидание...");
                afterSpeechStatus = '';
            };
            synth.speak(utterance);
        }

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.continuous = false;

            talkBtn.addEventListener('click', () => {
                if (isListening) return;

                try {
                    recognition.start();
                    isListening = true;
                    talkBtn.textContent = "СЛУШАЮ...";
                    talkBtn.classList.add('listening');
                    statusText.textContent = "Говори...";
                    jarvisIcon.classList.add('active');
                    
                    const unlock = new SpeechSynthesisUtterance('');
                    unlock.volume = 0;
                    synth.speak(unlock);
                } catch(e) {
                    statusText.textContent = "Ошибка. Подожди секунду.";
                }
            });

            recognition.onresult = (event) => {
                let command = event.results[0][0].transcript.toLowerCase().replace(/ё/g, 'е').replace(/[.,!?]/g, '').trim();
                if (command.includes('крестики нолики')) command = command.replace('крестики нолики', 'крестики-нолики');
                statusText.textContent = `Вы: "${command}"`;
                
                isListening = false;
                talkBtn.textContent = "НАЖМИ И ГОВОРИ";
                talkBtn.classList.remove('listening');
                jarvisIcon.classList.remove('active');

                // --- КОМАНДЫ БЕЗ ЗАДЕРЖКИ ---

                if (command.includes('погода') || command.includes('погоду')) {
                    showWeatherByLocation();
                }
                else if (command.includes('привет') || command.includes('здравствуй')) {
                    speak("Здравствуйте, сэр. Системы в норме.");
                }
                else if (command.includes('включи видео') || command.includes('найди видео')) {
                    let videoName = command.replace('джарвис', '').replace('включи видео', '').replace('найди видео', '').replace('на ютубе', '').replace('в ютубе', '').trim();
                    if (videoName) { speak(`Ищу видео ${videoName}.`); openLink(`https://www.youtube.com/results?search_query=${encodeURIComponent(videoName)}`); } else { speak("Какое видео найти?"); }
                }
                else if (command.includes('открой канал')) {
                    let channelName = command.replace('джарвис', '').replace('открой канал', '').replace('на ютубе', '').trim();
                    if (channelName) { speak(`Открываю канал ${channelName}.`); openLink(`https://www.youtube.com/results?search_query=${encodeURIComponent(channelName)}&sp=EgIQAg%253D%253D`); } else { speak("Какой канал?"); }
                }
                else if (command.includes('видео в вк')) {
                    let vkVideo = command.replace('джарвис', '').replace('видео в вк', '').trim();
                    if (vkVideo) { speak(`Ищу ${vkVideo} во ВКонтакте.`); openLink(`https://vk.com/video?q=${encodeURIComponent(vkVideo)}`); } else { speak("Какое видео?"); }
                }
                else if (command.includes('рутуб')) {
                    let rutubeSearch = command.replace('джарвис', '').replace('открой рутуб', '').replace('найди на рутубе', '').replace('рутуб', '').trim();
                    if (rutubeSearch) { speak(`Ищу ${rutubeSearch} на Рутубе.`); openLink(`https://rutube.ru/search/?query=${encodeURIComponent(rutubeSearch)}`); } else { speak("Открываю Рутуб."); openLink('https://rutube.ru'); }
                }
                else if (command.includes('открой ютуб')) { speak("Открываю."); openLink('https://youtube.com'); }
                else if (command.includes('открой вк')) { speak("Открываю."); openLink('https://vk.com'); }
                else if (command.includes('расскажи о') || command.includes('расскажи про') || command.includes('что такое')) {
                    let topic = command.replace('джарвис', '').replace('расскажи о', '').replace('расскажи про', '').replace('что такое', '').trim();
                    if (topic) { speak(`Открываю информацию.`); openLink(`https://yandex.ru/search/?text=${encodeURIComponent(topic)}`); } else { speak("О чем рассказать?"); }
                }
                else if (command.includes('включи музыку')) {
                    let song = command.replace('джарвис', '').replace('включи музыку', '').trim();
                    if (song) { speak(`Ищу ${song}.`); openLink(`https://music.yandex.ru/search?text=${encodeURIComponent(song)}`); } else { speak("Какую песню?"); }
                }
                else if (command.includes('время')) { speak(`Сейчас ${new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}`); }
                else if (command.includes('кубик')) { rollDice(); }
                else if (command.includes('монет')) { flipCoin(); }
                else if (command.includes('поиграем') || command.includes('крестики-нолики')) { 
                    board = ["", "", "", "", "", "", "", "", ""]; isGameActive = true;
                    cells.forEach((cell, i) => { cell.textContent = ""; });
                    gameBoard.style.display = "grid";
                    document.body.classList.add('game-mode');
                    setTimeout(() => { gameBoard.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 350);
                    speak("Ваш ход. Назовите клетку.");
                }
                else if (isGameActive) {
                    let index = -1;
                    if (command.includes('верхняя левая')) index = 0; else if (command.includes('верхняя средняя')) index = 1; else if (command.includes('верхняя правая')) index = 2;
                    else if (command.includes('средняя левая')) index = 3; else if (command.includes('центр')) index = 4; else if (command.includes('средняя правая')) index = 5;
                    else if (command.includes('нижняя левая')) index = 6; else if (command.includes('нижняя средняя')) index = 7; else if (command.includes('нижняя правая')) index = 8;

                    if (index !== -1 && board[index] === "") {
                        board[index] = "X"; cells[index].textContent = "X";
                        if (!checkWin("X")) { makeAiMove(); }
                        checkGameEnd();
                    }
                }
                else { speak("Команда не распознана."); }
            };
            
            recognition.onend = () => {
                isListening = false;
                talkBtn.classList.remove('listening'); 
                talkBtn.textContent = "НАЖМИ И ГОВОРИ"; 
                jarvisIcon.classList.remove('active');
            };

            recognition.onerror = (event) => { 
                isListening = false;
                talkBtn.classList.remove('listening'); 
                talkBtn.textContent = "НАЖМИ И ГОВОРИ"; 
                jarvisIcon.classList.remove('active');
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    statusText.textContent = "Разреши доступ к микрофону!";
                } else if (event.error === 'audio-capture') {
                    statusText.textContent = "Микрофон не найден.";
                } else if (event.error === 'network') {
                    statusText.textContent = "Нет связи с сервисом распознавания речи. Проверь интернет.";
                } else if (event.error === 'aborted') {
                    statusText.textContent = "Нажми кнопку и говори";
                } else if (event.error === 'no-speech') {
                    statusText.textContent = "Я ничего не услышал. Попробуй еще раз.";
                } else {
                    statusText.textContent = "Ошибка. Нажми еще раз.";
                }
            }
        } else {
            statusText.textContent = "Этот браузер не поддерживает голосовые команды. Открой сайт в Chrome, Edge или Safari.";
            talkBtn.addEventListener('click', () => {
                statusText.textContent = "Этот браузер не поддерживает голосовые команды. Открой сайт в Chrome, Edge или Safari.";
            });
        }

        if (synth && synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = () => synth.getVoices();
        }

        // --- ПОГОДА ПО ГЕОЛОКАЦИИ ---
        const weatherCard = document.getElementById('weatherCard');
        const WEATHER_CODES = {
            0: 'ясно', 1: 'преимущественно ясно', 2: 'переменная облачность', 3: 'пасмурно',
            45: 'туман', 48: 'туман с изморозью',
            51: 'слабая морось', 53: 'морось', 55: 'сильная морось', 56: 'ледяная морось', 57: 'сильная ледяная морось',
            61: 'небольшой дождь', 63: 'дождь', 65: 'сильный дождь', 66: 'ледяной дождь', 67: 'сильный ледяной дождь',
            71: 'небольшой снег', 73: 'снег', 75: 'сильный снег', 77: 'снежная крупа',
            80: 'небольшой ливень', 81: 'ливень', 82: 'сильный ливень', 85: 'небольшой снегопад', 86: 'сильный снегопад',
            95: 'гроза', 96: 'гроза с градом', 99: 'сильная гроза с градом'
        };

        function degWord(n) {
            n = Math.abs(n) % 100; const n1 = n % 10;
            if (n > 10 && n < 20) return 'градусов';
            if (n1 === 1) return 'градус';
            if (n1 >= 2 && n1 <= 4) return 'градуса';
            return 'градусов';
        }

        function weatherFallback(reason) {
            weatherCard.style.display = 'none';
            speak(reason + " Открываю прогноз погоды в Анадыре.");
            openLink('https://yandex.ru/pogoda/anadyr');
        }

        function showWeatherByLocation() {
            if (!navigator.geolocation) { weatherFallback("Геолокация недоступна."); return; }
            statusText.textContent = "Определяю местоположение...";
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude.toFixed(4);
                const lon = pos.coords.longitude.toFixed(4);
                try {
                    const [wRes, gRes] = await Promise.all([
                        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&wind_speed_unit=ms&timezone=auto&forecast_days=1`),
                        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ru`).catch(() => null)
                    ]);
                    const w = await wRes.json();
                    let city = '';
                    if (gRes && gRes.ok) {
                        const g = await gRes.json();
                        city = (g.city || g.locality || '').replace(/^городской округ\s+/i, '').trim();
                    }
                    const t = Math.round(w.current.temperature_2m);
                    const feels = Math.round(w.current.apparent_temperature);
                    const wind = Math.round(w.current.wind_speed_10m);
                    const desc = WEATHER_CODES[w.current.weather_code] || '';
                    const tMax = Math.round(w.daily.temperature_2m_max[0]);
                    const tMin = Math.round(w.daily.temperature_2m_min[0]);
                    const sign = n => (n > 0 ? '+' : '') + n;

                    weatherCard.innerHTML = `
                        <div class="w-city">${city || 'Ваше местоположение'}</div>
                        <div class="w-temp">${sign(t)}°C</div>
                        <div>${desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : ''}</div>
                        <div>Ощущается как ${sign(feels)}°C · ветер ${wind} м/с</div>
                        <div>Сегодня от ${sign(tMin)}° до ${sign(tMax)}°</div>`;
                    weatherCard.style.display = 'block';
                    afterSpeechStatus = city ? `Погода: ${city}` : 'Погода по вашему местоположению';
                    statusText.textContent = afterSpeechStatus;
                    setTimeout(() => { weatherCard.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);

                    const where = city ? `В городе ${city}` : 'У вас';
                    speak(`${where} сейчас ${t} ${degWord(t)}, ${desc}. Ощущается как ${feels}. Ветер ${wind} ${wind % 10 === 1 && wind % 100 !== 11 ? 'метр' : (wind % 10 >= 2 && wind % 10 <= 4 && (wind % 100 < 10 || wind % 100 >= 20) ? 'метра' : 'метров')} в секунду.`);
                    openLink(`https://yandex.ru/pogoda/?lat=${lat}&lon=${lon}`);
                } catch (e) {
                    weatherCard.style.display = 'none';
                    speak("Не удалось получить прогноз. Открываю погоду по вашему местоположению.");
                    openLink(`https://yandex.ru/pogoda/?lat=${lat}&lon=${lon}`);
                }
            }, (err) => {
                if (err.code === 1) {
                    weatherCard.style.display = 'none';
                    afterSpeechStatus = "Нет доступа к геолокации. Включите её в настройках и скажите «погода» ещё раз.";
                    statusText.textContent = afterSpeechStatus;
                    speak("Нет доступа к геолокации. Включите, пожалуйста.");
                }
                else weatherFallback("Не удалось определить местоположение.");
            }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
        }

        // --- КУБИК И МОНЕТКА С АНИМАЦИЕЙ ---
        const rollArea = document.getElementById('rollArea');
        const rollObject = document.getElementById('rollObject');
        const rollResult = document.getElementById('rollResult');
        const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
        // Поворот куба, при котором нужная грань смотрит на зрителя
        const FACE_ROT = { 1: [0, 0], 2: [-90, 0], 3: [0, -90], 4: [0, 90], 5: [90, 0], 6: [0, 180] };
        let rollTimer = null, hideTimer = null;
        window.__lastRoll = null;

        function setTransform(el, t) { el.style.webkitTransform = t; el.style.transform = t; }

        function buildDice() {
            let html = '<div class="scene"><div class="toss"><div class="cube">';
            for (let n = 1; n <= 6; n++) {
                html += `<div class="face f${n}">`;
                for (let i = 0; i < 9; i++) html += `<div class="pip${PIPS[n].includes(i) ? ' on' : ''}"></div>`;
                html += '</div>';
            }
            html += '</div></div></div><div class="shadow3d"></div>';
            rollObject.innerHTML = html;
        }

        const EAGLE_SVG = '<svg viewBox="0 0 40 40" fill="#5a3d08"><path d="M20 6l2.5 4 4-2-1 4.5 4.5-1-3 4 5 1-5 3 2 4.5-5-2-1.5 6.5L20 34l-2.5-6.5L16 21.5l-5 2 2-4.5-5-3 5-1-3-4 4.5 1-1-4.5 4 2z"/></svg>';
        const TAILS_SVG = '<svg viewBox="0 0 40 40" fill="none" stroke="#5a3d08" stroke-width="2.5"><circle cx="20" cy="20" r="14"/><text x="20" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#5a3d08" stroke="none" font-family="Roboto Mono, monospace">1</text></svg>';

        function buildCoin() {
            let html = '<div class="scene"><div class="toss"><div class="coin3d">';
            for (let z = -3; z <= 3; z++) html += `<div class="edge" style="-webkit-transform: translateZ(${z}px); transform: translateZ(${z}px);"></div>`;
            html += `<div class="side heads">${EAGLE_SVG}ОРЁЛ</div>`;
            html += `<div class="side tails">${TAILS_SVG}РЕШКА</div>`;
            html += '</div></div></div><div class="shadow3d"></div>';
            rollObject.innerHTML = html;
        }

        function startRoll() {
            clearTimeout(rollTimer); clearTimeout(hideTimer);
            rollResult.textContent = '';
            rollArea.classList.add('show');
            document.body.classList.add('rolling');
            setTimeout(() => { rollArea.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
        }

        function finishRoll(text) {
            rollResult.textContent = text;
            speak(text);
            hideTimer = setTimeout(() => { rollArea.classList.remove('show'); document.body.classList.remove('rolling'); }, 4000);
        }

        function launch(el, finalTransform, onDone) {
            const toss = rollObject.querySelector('.toss');
            setTransform(el, 'rotateX(-20deg) rotateY(20deg)');
            void el.offsetWidth;
            requestAnimationFrame(() => {
                el.classList.add('spin');
                toss.classList.add('jump');
                setTransform(el, finalTransform);
                rollTimer = setTimeout(onDone, 1650);
            });
        }

        function rollDice() {
            const result = Math.floor(Math.random() * 6) + 1;
            window.__lastRoll = result;
            startRoll();
            buildDice();
            const cube = rollObject.querySelector('.cube');
            const [rx, ry] = FACE_ROT[result];
            const turnsX = 360 * (2 + Math.floor(Math.random() * 2));
            const turnsY = 360 * (2 + Math.floor(Math.random() * 2));
            const turnsZ = 360 * (1 + Math.floor(Math.random() * 2));
            launch(cube, `rotateX(${rx + turnsX}deg) rotateY(${ry + turnsY}deg) rotateZ(${turnsZ}deg)`, () => {
                // Оставляем только выпавшую грань: результат виден правильно даже там, где 3D не поддерживается
                cube.querySelectorAll('.face').forEach(f => { if (!f.classList.contains('f' + result)) f.style.display = 'none'; });
                try {
                    const face = cube.querySelector('.f' + result);
                    const m = new DOMMatrix(getComputedStyle(cube).transform).multiply(new DOMMatrix(getComputedStyle(face).transform));
                    cube.classList.remove('spin');
                    setTransform(cube, 'none');
                    setTransform(face, m.toString());
                } catch (e) {}
                finishRoll(`Выпало ${result}`);
            });
        }

        function flipCoin() {
            const result = Math.random() < 0.5 ? 'Орёл' : 'Решка';
            window.__lastRoll = result;
            startRoll();
            buildCoin();
            const coin = rollObject.querySelector('.coin3d');
            const flips = 360 * (4 + Math.floor(Math.random() * 2));
            const finalX = flips + (result === 'Орёл' ? 0 : 180);
            launch(coin, `rotateX(${finalX}deg) rotateY(0deg)`, () => {
                coin.querySelector(result === 'Орёл' ? '.tails' : '.heads').style.display = 'none';
                finishRoll(result === 'Орёл' ? 'Выпал орёл' : 'Выпала решка');
            });
        }

        function makeAiMove() {
            for (let i = 0; i < 9; i++) { if (board[i] === "") { board[i] = "O"; if (checkWin("O")) { cells[i].textContent = "O"; return; } board[i] = ""; } }
            for (let i = 0; i < 9; i++) { if (board[i] === "") { board[i] = "X"; if (checkWin("X")) { board[i] = "O"; cells[i].textContent = "O"; return; } board[i] = ""; } }
            if (board[4] === "") { board[4] = "O"; cells[4].textContent = "O"; return; }
            let empty = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            if (empty.length > 0) { let r = empty[Math.floor(Math.random() * empty.length)]; board[r] = "O"; cells[r].textContent = "O"; }
        }
        function checkWin(p) {
            const w = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];
            return w.some(v => v.every(i => board[i] === p));
        }
        function checkGameEnd() {
            if (checkWin("X")) { speak("Вы победили!"); isGameActive = false; }
            else if (checkWin("O")) { speak("Я победил."); isGameActive = false; }
            else if (board.every(c => c !== "")) { speak("Ничья."); isGameActive = false; }
        }
        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                if (!isGameActive) return;
                let index = parseInt(cell.dataset.index);
                if (board[index] === "") {
                    board[index] = "X"; cell.textContent = "X";
                    if (!checkWin("X")) { makeAiMove(); }
                    checkGameEnd();
                }
            });
        });
    </script>
</body>
</html>
